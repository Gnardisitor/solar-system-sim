<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solar System Sim</title>
    <meta name="description" content="An interactive N-body solar system simulation rendered with Three.js and a WebAssembly physics engine.">
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/interactive.css">
    <link rel="icon" href="./icons/favicon.ico" sizes="16x16">
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
    <!-- Critical-path preloads: api.json and the fonts below are otherwise discovered
         only after the JS bundle downloads and evaluates (api.json via fetch() in
         main.ts, fonts via CSSOM matching), adding a full serial round trip to first
         frame. Preloading starts them at HTML parse time instead. Fonts always need
         crossorigin (fetched in CORS mode even same-origin). The WASM binary is
         discovered by the Emscripten glue under a hashed name, so it can't be
         preloaded statically; it's small (25 KB) and fetches in parallel once the
         bundle is executing. -->
    <link rel="preload" href="./api.json" as="fetch" fetchpriority="high">
    <link rel="preload" href="./fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./fonts/geist-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
    <a id="info-link" class="icon-btn corner-btn" href="about.html" title="About this project" aria-label="About this project">
        <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm16-40a8,8,0,0,1-8,8,16,16,0,0,1-16-16V128a8,8,0,0,1,0-16,16,16,0,0,1,16,16v40A8,8,0,0,1,144,176ZM112,84a12,12,0,1,1,12,12A12,12,0,0,1,112,84Z"/></svg>
    </a>

    <div id="loading" class="loading" role="status" aria-live="polite">
        <div class="loading-ring" aria-hidden="true"></div>
        <p>Loading simulation</p>
    </div>

    <div id="canvas"></div>
    <div class="vignette" aria-hidden="true"></div>

    <div id="controls" class="dock">
        <div class="dock-group dock-playback">
            <button id="run" class="icon-btn icon-btn-accent" title="Play" aria-label="Play">
                <svg class="icon-play" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M240,128a15.74,15.74,0,0,1-7.6,13.51L88.32,229.65a16,16,0,0,1-16.2.3A15.86,15.86,0,0,1,64,216.13V39.87a15.86,15.86,0,0,1,8.12-13.82,16,16,0,0,1,16.2.3L232.4,114.49A15.74,15.74,0,0,1,240,128Z"/></svg>
                <svg class="icon-pause icon-hidden" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M216,48V208a16,16,0,0,1-16,16H160a16,16,0,0,1-16-16V48a16,16,0,0,1,16-16h40A16,16,0,0,1,216,48ZM96,32H56A16,16,0,0,0,40,48V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V48A16,16,0,0,0,96,32Z"/></svg>
            </button>
            <p id="dateText" class="mono readout"></p>
        </div>

        <div class="dock-collapsible" id="dock-collapsible">
            <div class="dock-collapsible-inner">
                <div class="dock-divider"></div>

                <div class="dock-group dock-sliders">
                    <div class="slider-field">
                        <label for="step">Step size</label>
                        <input type="range" min="0.1" max="5" value="0.5" step="0.1" id="step">
                        <span id="stepText" class="mono"></span>
                    </div>
                    <div class="slider-field">
                        <label for="stepTime">Update rate</label>
                        <input type="range" min="0.01" max="1" value="0.01" step="0.01" id="stepTime">
                        <span id="stepTimeText" class="mono"></span>
                    </div>
                </div>

                <div class="dock-divider"></div>

                <div class="dock-group dock-method" role="radiogroup" aria-label="Simulation method" id="method-group">
                    <span class="method-indicator" aria-hidden="true"></span>
                    <button type="button" class="method-btn" data-method="euler" role="radio" aria-checked="false">Euler</button>
                    <button type="button" class="method-btn" data-method="verlet" role="radio" aria-checked="true">Verlet</button>
                    <button type="button" class="method-btn" data-method="rk4" role="radio" aria-checked="false">RK4</button>
                </div>

                <div class="dock-divider"></div>

                <div class="dock-group dock-year">
                    <label for="yearInput" class="sr-only">Year</label>
                    <input type="number" id="yearInput" min="1750" max="2050" value="2000" aria-describedby="yearError">
                    <button id="setYear" class="text-btn">Set</button>
                </div>
            </div>
        </div>

        <button id="collapse-btn" class="icon-btn dock-collapse" title="Collapse" aria-label="Collapse controls">
            <svg class="icon-caret-down" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg>
            <svg class="icon-caret-up icon-hidden" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M213.66,165.66a8,8,0,0,1-11.32,0L128,91.31,53.66,165.66a8,8,0,0,1-11.32-11.32l80-80a8,8,0,0,1,11.32,0l80,80A8,8,0,0,1,213.66,165.66Z"/></svg>
        </button>
    </div>

    <!-- Positioned via JS (position: fixed, computed from #yearInput's real
         screen position) and deliberately kept outside #controls: .dock's
         collapse animation requires overflow: hidden on .dock-collapsible /
         .dock-collapsible-inner, which would silently clip any descendant
         tooltip popping up above its anchor, and no CSS can exempt one
         descendant from an ancestor's overflow: hidden. -->
    <p id="yearError" class="year-error" role="alert"></p>

    <script type="module" src="./src/main.ts"></script>
</body>
</html>
