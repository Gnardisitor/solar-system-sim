<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">

        <link rel="stylesheet" href="./css/tokens.css">

        <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
        <!-- documentation.md is rendered to documentation.html at build time (scripts/build-docs.ts) —

        <link rel="stylesheet" href="./css/katex/katex.min.css">
        <link rel="stylesheet" href="./css/hljs-vs2015.css">
    </head>
    <body>
        <header>
            <a id="back-link" href="./index.html" title="Back to simulation">
                <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M222,128a6,6,0,0,1-6,6H54.49l61.75,61.76a6,6,0,1,1-8.48,8.48l-72-72a6,6,0,0,1,0-8.48l72-72a6,6,0,0,1,8.48,8.48L54.49,122H216A6,6,0,0,1,222,128Z"/></svg>

                <img id="icon" src="./icons/favicon.svg" alt="">
                <h1>Solar System Sim</h1>
            </div>
        </header>
        <main>
            <section>
                <h2>About the project</h2>
                <div id="markdown-content">Loading…</div>
            </section>
        </main>
        <script>
        // documentation.html is pre-rendered (see scripts/build-docs.js) — just inject it.
        fetch('./documentation.html').then(response => response.text()).then(html => {
            document.getElementById('markdown-content').innerHTML = html;
        });
        </script>
    </body>
</html>
